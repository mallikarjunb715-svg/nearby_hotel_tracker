{% extends "base.html" %}
{% block content %}
<div class="container py-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-9 col-xl-8">
            <!-- Header Card -->
            <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white position-relative overflow-hidden">
                <div class="position-absolute top-0 start-0 h-100 bg-danger" style="width: 5px;"></div>
                
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                    <div>
                        <h2 class="fw-extrabold mb-1 text-dark"><i class="fas fa-store text-danger me-2"></i>Add New Restaurant</h2>
                        <p class="text-muted small mb-0">Partner with FoodNearMe to showcase your menu to local foodies</p>
                    </div>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-semibold transition-all">
                        <i class="fas fa-arrow-left me-1"></i> Back to Home
                    </a>
                </div>

                <hr class="text-muted opacity-15 mb-4">

                <form action="{{ url_for('add_restaurant') }}" method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                    <!-- Restaurant Details Section -->
                    <h5 class="fw-bold text-dark mb-3"><i class="fas fa-info-circle text-danger me-2"></i>Basic Information</h5>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted">Restaurant Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 rounded-start-pill ps-3 text-muted"><i class="fas fa-utensils"></i></span>
                                <input type="text" name="name" class="form-control rounded-end-pill bg-light border-0 shadow-none px-3" placeholder="e.g. Bella Italia" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted">Cuisine Type</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 rounded-start-pill ps-3 text-muted"><i class="fas fa-concierge-bell"></i></span>
                                <input type="text" name="cuisine" class="form-control rounded-end-pill bg-light border-0 shadow-none px-3" placeholder="e.g. Italian, North Indian" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted">Street Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 rounded-start-pill ps-3 text-muted"><i class="fas fa-map-marker-alt"></i></span>
                                <input type="text" name="address" class="form-control rounded-end-pill bg-light border-0 shadow-none px-3" placeholder="e.g. 123 Main Street" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-muted">City</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 rounded-start-pill ps-3 text-muted"><i class="fas fa-city"></i></span>
                                <input type="text" name="city" class="form-control rounded-end-pill bg-light border-0 shadow-none px-3" placeholder="e.g. New York" required>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold small text-muted">Description</label>
                            <textarea name="description" class="form-control rounded-4 bg-light border-0 shadow-none p-3" rows="3" placeholder="Write a brief overview of your restaurant specialties, ambiance, or history..."></textarea>
                        </div>
                    </div>

                    <!-- Location Coordinates (Optional for mapping) -->
                    <div class="bg-light p-4 rounded-4 mb-4 border border-opacity-10">
                        <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                            <label class="form-label fw-bold mb-0 text-dark small"><i class="fas fa-compass text-danger me-1"></i> Geo-Coordinates (For Map Distance Routing)</label>
                            <button type="button" class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-semibold fs-7" onclick="fetchCurrentLocation()">
                                <i class="fas fa-crosshairs me-1"></i> Auto-Detect Location
                            </button>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <input type="number" step="any" name="latitude" id="latInput" class="form-control rounded-pill bg-white border-0 shadow-none px-3 small" placeholder="Latitude (e.g. 37.7749)">
                            </div>
                            <div class="col-md-6">
                                <input type="number" step="any" name="longitude" id="lonInput" class="form-control rounded-pill bg-white border-0 shadow-none px-3 small" placeholder="Longitude (e.g. -122.4194)">
                            </div>
                        </div>
                    </div>

                    <!-- Image Upload with Live Preview -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-muted">Restaurant Banner Image</label>
                        <div class="input-group">
                            <input type="file" name="image_file" id="imageInput" class="form-control rounded-pill bg-light border-0 shadow-none px-3 py-2" accept="image/*" onchange="previewImage(event)">
                        </div>
                        <!-- Live Image Preview Container -->
                        <div id="imagePreviewContainer" class="mt-3 d-none">
                            <img id="outputPreview" class="rounded-4 object-fit-cover shadow-sm border" style="height: 180px; width: 100%; max-width: 320px;" alt="Preview">
                        </div>
                    </div>

                    <hr class="text-muted opacity-15 my-4">

                    <!-- Menu Manager Section -->
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <h5 class="fw-bold text-dark mb-0"><i class="fas fa-utensils text-danger me-2"></i>Menu Items</h5>
                        <button type="button" class="btn btn-outline-dark btn-sm rounded-pill px-3 fw-semibold shadow-sm hover-scale" onclick="addMenuItemField()">
                            <i class="fas fa-plus me-1"></i> Add Item
                        </button>
                    </div>

                    <div id="menu-items-container" class="mb-4">
                        <div class="row g-2 mb-2 menu-item-row align-items-center">
                            <div class="col-7 col-md-7">
                                <input type="text" name="menu_names[]" class="form-control rounded-pill bg-light border-0 shadow-none px-3" placeholder="Item Name (e.g. Margherita Pizza)" required>
                            </div>
                            <div class="col-4 col-md-4">
                                <input type="number" step="0.01" name="menu_prices[]" class="form-control rounded-pill bg-light border-0 shadow-none px-3" placeholder="Price ($)" required>
                            </div>
                            <div class="col-1 col-md-1 text-center">
                                <!-- First item delete hidden or disabled -->
                            </div>
                        </div>
                    </div>

                    <!-- Submit Action Button -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-danger btn-lg rounded-pill fw-bold py-3 shadow hover-scale">
                            <i class="fas fa-check-circle me-2"></i>Save & Publish Restaurant
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Custom Page Styling -->
<style>
    .fw-extrabold { font-weight: 800; }
    .transition-all { transition: all 0.25s ease-in-out; }
    .hover-scale { transition: transform 0.2s ease; }
    .hover-scale:active { transform: scale(0.98); }
    .fs-7 { font-size: 0.85rem; }
</style>

<!-- Advanced Form Controller Scripts -->
<script>
    function addMenuItemField() {
        const container = document.getElementById('menu-items-container');
        const div = document.createElement('div');
        div.className = 'row g-2 mb-2 menu-item-row align-items-center animate-fade-in';
        div.innerHTML = `
            <div class="col-7 col-md-7">
                <input type="text" name="menu_names[]" class="form-control rounded-pill bg-light border-0 shadow-none px-3" placeholder="Item Name" required>
            </div>
            <div class="col-4 col-md-4">
                <input type="number" step="0.01" name="menu_prices[]" class="form-control rounded-pill bg-light border-0 shadow-none px-3" placeholder="Price ($)" required>
            </div>
            <div class="col-1 col-md-1 text-center">
                <button type="button" class="btn btn-outline-danger btn-sm rounded-circle d-flex align-items-center justify-content-center mx-auto shadow-none" style="width: 32px; height: 32px;" onclick="this.closest('.menu-item-row').remove()">
                    <i class="fas fa-times fa-xs"></i>
                </button>
            </div>
        `;
        container.appendChild(div);
    }

    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function(){
            const output = document.getElementById('outputPreview');
            output.src = reader.result;
            document.getElementById('imagePreviewContainer').classList.remove('d-none');
        };
        if(event.target.files[0]) {
            reader.readAsDataURL(event.target.files[0]);
        }
    }

    function fetchCurrentLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                document.getElementById('latInput').value = position.coords.latitude;
                document.getElementById('lonInput').value = position.coords.longitude;
                alert("Location coordinates captured successfully!");
            }, function() {
                alert("Unable to retrieve your location. Please check browser permissions.");
            });
        } else {
            alert("Geolocation is not supported by your browser.");
        }
    }
</script>
{% endblock %}
