{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Hotel - {{ hotel.name }}</h2>
    <hr>
    <form action="{{ url_for('admin.edit_hotel', hotel_id=hotel.id) }}" method="POST" enctype="multipart/form-data">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Hotel Name *</label>
                <input type="text" name="name" class="form-control" value="{{ hotel.name }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">City *</label>
                <input type="text" name="city" class="form-control" value="{{ hotel.city }}" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" name="address" class="form-control" value="{{ hotel.address }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" name="phone" class="form-control" value="{{ hotel.phone }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3">{{ hotel.description }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Update Hotel Photo</label>
            <input type="file" name="image" class="form-control" accept="image/*">
            {% if hotel.image %}
            <small class="text-muted">Current Photo: {{ hotel.image }}</small>
            {% endif %}
        </div>
        <button type="submit" class="btn btn-primary">Update Hotel</button>
        <a href="{{ url_for('admin.manage_hotels') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
