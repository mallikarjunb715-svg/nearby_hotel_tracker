{% extends "base.html" %}
{% block content %}
<div class="container py-4" style="max-width: 700px;">
    <div class="card shadow-sm border-0 rounded-4 p-4">
        <h3 class="fw-bold mb-4 text-center text-primary"><i class="fas fa-store me-2"></i>{{ title }}</h3>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label fw-semibold">Restaurant Name</label>
                <input type="text" name="name" class="form-control" value="{{ restaurant.name if restaurant else '' }}" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">City</label>
                    <input type="text" name="city" class="form-control" value="{{ restaurant.city if restaurant else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Cuisine Type</label>
                    <input type="text" name="cuisine" class="form-control" value="{{ restaurant.cuisine if restaurant else '' }}" placeholder="e.g. North Indian, Italian" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Full Address</label>
                <input type="text" name="address" class="form-control" value="{{ restaurant.address if restaurant else '' }}" required>
            </div>

            <!-- Restaurant GPS Coordinates for Distance Tracking -->
            <div class="row bg-light p-3 rounded-3 mb-3 border">
                <div class="col-12 mb-2">
                    <label class="form-label fw-semibold text-dark mb-0"><i class="fas fa-map-marked-alt text-danger me-1"></i> Restaurant GPS Coordinates</label>
                    <small class="text-muted d-block">Used for live distance calculation from the user's location.</small>
                </div>
                <div class="col-md-6 mb-2">
                    <label class="form-label small">Latitude</label>
                    <input type="text" step="any" name="latitude" class="form-control form-control-sm" value="{{ restaurant.latitude if restaurant else '12.9716' }}" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label class="form-label small">Longitude</label>
                    <input type="text" step="any" name="longitude" class="form-control form-control-sm" value="{{ restaurant.longitude if restaurant else '77.5946' }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ restaurant.description if restaurant else '' }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Upload Restaurant Image</label>
                <input type="file" name="image_file" class="form-control">
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Or Image URL</label>
                <input type="text" name="image_url" class="form-control" value="{{ restaurant.image_url if restaurant and not restaurant.image_url.startswith('uploads/') else '' }}" placeholder="https://...">
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm">Save Restaurant</button>
        </form>
    </div>
</div>
{% endblock %}
