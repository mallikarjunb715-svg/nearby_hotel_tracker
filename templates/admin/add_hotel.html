{% extends "base.html" %}

{% block content %}
<div class="container mt-4 mb-5">
    <h2 class="mb-3">🏨 Hotel Owner - Add Hotel & Food Menu</h2>
    <hr>
    
    <form action="{{ url_for('admin.add_hotel') }}" method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
        
        <!-- SECTION 1: HOTEL DETAILS -->
        <h4 class="text-primary mb-3">1. Hotel Details</h4>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Hotel Name *</label>
                <input type="text" name="hotel_name" class="form-control" placeholder="e.g. Spice Villa Restaurant" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">City *</label>
                <input type="text" name="city" class="form-control" placeholder="e.g. Bangalore" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8 mb-3">
                <label class="form-label font-weight-bold">Address</label>
                <input type="text" name="address" class="form-control" placeholder="e.g. #12, 1st Main Rd, Indiranagar">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label font-weight-bold">Phone Number</label>
                <input type="text" name="phone" class="form-control" placeholder="e.g. +91 9876543210">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Avg / Base Price (₹)</label>
                <input type="number" step="0.01" name="price" class="form-control" placeholder="e.g. 250.00">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Hotel Cover Photo</label>
                <input type="file" name="hotel_image" class="form-control" accept="image/*">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label font-weight-bold">Hotel Description</label>
            <textarea name="description" class="form-control" rows="2" placeholder="Brief details about cuisine and atmosphere..."></textarea>
        </div>

        <!-- SECTION 2: LOCATION TRACKING (GOOGLE MAPS) -->
        <h4 class="text-primary mt-4 mb-3">2. Track Location (Google Maps)</h4>
        <div class="bg-light p-3 rounded mb-4">
            <p class="text-muted small">Drag the pin on the map or click <strong>Use GPS</strong> to pin your exact location for customer navigation.</p>
            <div id="map" style="height: 300px; width: 100%; border-radius: 8px; border: 1px solid #ccc;" class="mb-3"></div>
            
            <div class="row">
                <div class="col-md-5 mb-2">
                    <label class="form-label font-weight-bold">Latitude</label>
                    <input type="number" step="any" id="latitude" name="latitude" class="form-control" readonly required>
                </div>
                <div class="col-md-5 mb-2">
                    <label class="form-label font-weight-bold">Longitude</label>
                    <input type="number" step="any" id="longitude" name="longitude" class="form-control" readonly required>
                </div>
                <div class="col-md-2 mb-2 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-primary w-100" onclick="getCurrentLocation()">Use GPS</button>
                </div>
            </div>
        </div>

        <!-- SECTION 3: AVAILABLE FOOD ITEMS -->
        <h4 class="text-primary mt-3 mb-3">3. Available Food Items</h4>
        <div id="food-container">
            <div class="food-item border p-3 rounded mb-3 bg-white shadow-sm">
                <div class="row">
                    <div class="col-md-5 mb-2">
                        <label class="form-label">Food Item Name *</label>
                        <input type="text" name="food_name[]" class="form-control" placeholder="e.g. Paneer Butter Masala" required>
                    </div>
                    <div class="col-md-3 mb-2">
                        <label class="form-label">Price (₹) *</label>
                        <input type="number" step="0.01" name="food_price[]" class="form-control" placeholder="e.g. 220.00" required>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Food Photo</label>
                        <input type="file" name="food_image[]" class="form-control" accept="image/*">
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-md-11">
                        <input type="text" name="food_description[]" class="form-control" placeholder="Description e.g. Fresh cottage cheese cooked in creamy tomato gravy">
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="button" class="btn btn-danger btn-sm w-100" onclick="removeFood(this)">X</button>
                    </div>
                </div>
            </div>
        </div>

        <button type="button" class="btn btn-outline-secondary mb-4" onclick="addFoodRow()">+ Add Another Food Item</button>

        <!-- SUBMIT -->
        <button type="submit" class="btn btn-success fs-5 w-100 py-2">Publish Hotel & Menu</button>
    </form>
</div>

<!-- Google Maps JavaScript API -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap" async defer></script>

<script>
// Google Maps Handler
let map, marker;
const defaultLat = 12.9716; 
const defaultLng = 77.5946;

function initMap() {
    const defaultPos = { lat: defaultLat, lng: defaultLng };
    map = new google.maps.Map(document.getElementById("map"), { zoom: 13, center: defaultPos });
    marker = new google.maps.Marker({ position: defaultPos, map: map, draggable: true });

    updateCoordinates(defaultLat, defaultLng);

    google.maps.event.addListener(marker, 'dragend', function(evt) {
        updateCoordinates(evt.latLng.lat(), evt.latLng.lng());
    });
    google.maps.event.addListener(map, 'click', function(evt) {
        marker.setPosition(evt.latLng);
        updateCoordinates(evt.latLng.lat(), evt.latLng.lng());
    });
}

function updateCoordinates(lat, lng) {
    document.getElementById('latitude').value = lat.toFixed(6);
    document.getElementById('longitude').value = lng.toFixed(6);
}

function getCurrentLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            const pos = { lat: position.coords.latitude, lng: position.coords.longitude };
            map.setCenter(pos);
            map.setZoom(15);
            marker.setPosition(pos);
            updateCoordinates(pos.lat, pos.lng);
        });
    }
}

// Dynamic Food Rows
function addFoodRow() {
    const container = document.getElementById('food-container');
    const newRow = document.createElement('div');
    newRow.className = 'food-item border p-3 rounded mb-3 bg-white shadow-sm';
    newRow.innerHTML = `
        <div class="row">
            <div class="col-md-5 mb-2">
                <label class="form-label">Food Item Name *</label>
                <input type="text" name="food_name[]" class="form-control" placeholder="e.g. Garlic Naan" required>
            </div>
            <div class="col-md-3 mb-2">
                <label class="form-label">Price (₹) *</label>
                <input type="number" step="0.01" name="food_price[]" class="form-control" placeholder="e.g. 50.00" required>
            </div>
            <div class="col-md-4 mb-2">
                <label class="form-label">Food Photo</label>
                <input type="file" name="food_image[]" class="form-control" accept="image/*">
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-11">
                <input type="text" name="food_description[]" class="form-control" placeholder="Description e.g. Tandoor baked bread with fresh garlic">
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button type="button" class="btn btn-danger btn-sm w-100" onclick="removeFood(this)">X</button>
            </div>
        </div>
    `;
    container.appendChild(newRow);
}

function removeFood(btn) {
    const items = document.querySelectorAll('.food-item');
    if (items.length > 1) {
        btn.closest('.food-item').remove();
    }
}
</script>
{% endblock %}
